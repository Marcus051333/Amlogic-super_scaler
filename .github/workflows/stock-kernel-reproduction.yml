name: SlimBOX S912 - final unmodified reproduction v1.4

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Pinned candidate kernel repository"
        required: true
        default: "LineageOS/android_kernel_amlogic_linux-4.9-pie"
        type: string
      source_ref:
        description: "Exact source commit/ref"
        required: true
        default: "fba6cce6b08f7c5c005737e88d30aebcc26c2f5a"
        type: string
      build_dtbs:
        description: "Also build DTBs"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  ARCH: arm
  TOOLCHAIN_ARCHIVE: gcc-linaro-6.3.1-2017.02-x86_64_arm-linux-gnueabihf.tar.xz
  TOOLCHAIN_SHA256: fe1cae02e0734665487b9b642171a5685a6e91416cea869bb22590f6dc7260c3
  KBUILD_BUILD_USER: daivietpda
  KBUILD_BUILD_HOST: gocmobile
  KBUILD_BUILD_VERSION: "1"
  KBUILD_BUILD_TIMESTAMP: "Wed Jul 8 19:59:03 +07 2020"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v7

      - name: Check stock inputs
        shell: bash
        run: |
          set -euo pipefail

          test -f stock/kernel-config.gz || {
            echo "::error::Missing stock/kernel-config.gz"
            exit 1
          }

          test -f stock/modversions/amvdec_h264.modversions.txt || {
            echo "::error::Missing amvdec_h264 CRC fingerprint"
            exit 1
          }

          test -f stock/modversions/decoder_common.modversions.txt || {
            echo "::error::Missing decoder_common CRC fingerprint"
            exit 1
          }

          test -f stock/modversions/providers.tsv || {
            echo "::error::Missing stock external-module provider CRC map"
            exit 1
          }

      - name: Checkout exact candidate kernel snapshot
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          path: kernel-src
          fetch-depth: 1

      - name: Verify pinned snapshot and suppress Git suffix
        shell: bash
        run: |
          set -euo pipefail

          actual="$(git -C kernel-src rev-parse HEAD)"
          echo "Checked out: $actual"

          # Exact source snapshot selected from the successful historical search.
          if [[ "${{ inputs.source_ref }}" =~ ^[0-9a-fA-F]{40}$ ]] && \
             [[ "$actual" != "${{ inputs.source_ref }}" ]]; then
            echo "::error::Checked-out commit is not the requested pinned SHA."
            exit 1
          fi

          # Keep CONFIG_LOCALVERSION_AUTO=y exactly as stock, but suppress the
          # repository-derived -g<sha> suffix. Linux 4.9 setlocalversion treats
          # an existing .scmversion as authoritative; an empty one means no SCM suffix.
          grep -q '\.scmversion' kernel-src/scripts/setlocalversion
          : > kernel-src/.scmversion

          {
            echo "repository=${{ inputs.source_repo }}"
            echo "requested_ref=${{ inputs.source_ref }}"
            echo "commit=$actual"
            echo "commit_date=$(git -C kernel-src show -s --format=%cI HEAD)"
            echo "author_date=$(git -C kernel-src show -s --format=%aI HEAD)"
            echo "subject=$(git -C kernel-src show -s --format=%s HEAD)"
            echo "scmversion_file=present_and_empty"
          } | tee SOURCE_SELECTION.txt

      - name: Install host build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex \
            libssl-dev libelf-dev libncurses-dev \
            device-tree-compiler u-boot-tools \
            kmod xz-utils gzip file rsync cpio \
            python3 perl binutils

      - name: Configure legacy host GCC compatibility
        shell: bash
        run: |
          set -euo pipefail

          # Old DTC sources rely on pre-GCC-10 common-symbol behavior.
          # This affects HOSTCC only, not the ARM target compiler or target ABI.
          cat > "$GITHUB_WORKSPACE/hostcc-fcommon" <<'EOF'
          #!/bin/sh
          exec gcc -fcommon "$@"
          EOF

          chmod +x "$GITHUB_WORKSPACE/hostcc-fcommon"
          echo "HOSTCC_COMPAT=$GITHUB_WORKSPACE/hostcc-fcommon" >> "$GITHUB_ENV"

      - name: Download exact Linaro GCC 6.3.1-2017.02
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchain
          cd toolchain

          urls=(
            "https://mirrors.dotsrc.org/armbian-dl/_toolchain/$TOOLCHAIN_ARCHIVE"
            "https://mirror-us-stl1.armbian.airframes.io/dl/_toolchain/$TOOLCHAIN_ARCHIVE"
            "https://releases.linaro.org/components/toolchain/binaries/6.3-2017.02/arm-linux-gnueabihf/$TOOLCHAIN_ARCHIVE"
          )

          ok=0
          for url in "${urls[@]}"; do
            echo "Trying: $url"
            rm -f "$TOOLCHAIN_ARCHIVE"

            if ! curl --fail --location --retry 3 --retry-delay 2 \
              --connect-timeout 20 \
              "$url" -o "$TOOLCHAIN_ARCHIVE"; then
              continue
            fi

            echo "Downloaded size: $(stat -c%s "$TOOLCHAIN_ARCHIVE") bytes"

            if echo "$TOOLCHAIN_SHA256  $TOOLCHAIN_ARCHIVE" | sha256sum -c -; then
              ok=1
              break
            fi
          done

          if [[ "$ok" != "1" ]]; then
            echo "::error::Could not download a valid Linaro GCC archive."
            exit 1
          fi

          tar -xJf "$TOOLCHAIN_ARCHIVE"

          TC_DIR="$GITHUB_WORKSPACE/toolchain/gcc-linaro-6.3.1-2017.02-x86_64_arm-linux-gnueabihf"
          test -x "$TC_DIR/bin/arm-linux-gnueabihf-gcc"

          echo "TC_DIR=$TC_DIR" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE=$TC_DIR/bin/arm-linux-gnueabihf-" >> "$GITHUB_ENV"

      - name: Record compiler and source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact build

          cp SOURCE_SELECTION.txt artifact/SOURCE_IDENTITY.txt

          "$TC_DIR/bin/arm-linux-gnueabihf-gcc" --version | tee artifact/TOOLCHAIN.txt
          grep -q "6.3.1" artifact/TOOLCHAIN.txt

          awk '/^VERSION =/{v=$3} /^PATCHLEVEL =/{p=$3} /^SUBLEVEL =/{s=$3} END{print v "." p "." s}' \
            kernel-src/Makefile | tee artifact/SOURCE_KERNEL_VERSION.txt

          test "$(cat artifact/SOURCE_KERNEL_VERSION.txt)" = "4.9.113"

          # .scmversion is intentionally untracked. Tracked source code must remain untouched.
          git -C kernel-src diff --exit-code

      - name: Prepare exact stock config and require zero config drift
        shell: bash
        run: |
          set -euo pipefail

          gzip -dc stock/kernel-config.gz > artifact/stock.config
          cp artifact/stock.config build/.config

          make -C kernel-src \
            O="$GITHUB_WORKSPACE/build" \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            HOSTCC="$HOSTCC_COMPAT" \
            olddefconfig 2>&1 | tee artifact/olddefconfig.log

          cp build/.config artifact/effective.config
          diff -u artifact/stock.config artifact/effective.config > artifact/config.diff || true

          if [[ -s artifact/config.diff ]]; then
            echo "::error::Stock config changed after olddefconfig; refusing final reproduction build."
            cat artifact/config.diff
            exit 1
          fi

          make -s -C kernel-src \
            O="$GITHUB_WORKSPACE/build" \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            HOSTCC="$HOSTCC_COMPAT" \
            kernelrelease | tee artifact/KERNELRELEASE.txt

          if [[ "$(cat artifact/KERNELRELEASE.txt)" != "4.9.113" ]]; then
            echo "::error::Expected exact KERNELRELEASE=4.9.113"
            exit 1
          fi

          echo "::notice::Exact stock-style KERNELRELEASE confirmed: 4.9.113"

      - name: Snapshot super_scaler source area
        shell: bash
        run: |
          set -euo pipefail
          VPP="kernel-src/drivers/amlogic/media/video_sink/vpp.c"

          {
            echo "File: $VPP"
            echo
            grep -n -B 10 -A 15 -E 'super_scaler' "$VPP" | head -n 180 || true
          } > artifact/VPP_SUPER_SCALER_SOURCE.txt

      - name: Build final completely unmodified kernel
        shell: bash
        run: |
          set -euo pipefail

          TARGETS=(zImage modules)
          if [[ "${{ inputs.build_dtbs }}" == "true" ]]; then
            TARGETS+=(dtbs)
          fi

          make -C kernel-src \
            O="$GITHUB_WORKSPACE/build" \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            HOSTCC="$HOSTCC_COMPAT" \
            -j"$(nproc)" \
            "${TARGETS[@]}" 2>&1 | tee artifact/build.log

      - name: Collect build products
        shell: bash
        run: |
          set -euo pipefail

          cp build/arch/arm/boot/zImage artifact/zImage
          cp build/Module.symvers artifact/Module.symvers
          cp build/System.map artifact/System.map
          cp build/vmlinux artifact/vmlinux

          mkdir -p artifact/dtbs
          if [[ -d build/arch/arm/boot/dts ]]; then
            while IFS= read -r -d '' f; do
              rel="${f#build/arch/arm/boot/dts/}"
              mkdir -p "artifact/dtbs/$(dirname "$rel")"
              cp "$f" "artifact/dtbs/$rel"
            done < <(find build/arch/arm/boot/dts -type f -name '*.dtb' -print0)
          fi

          {
            echo "zImage:"
            file artifact/zImage
            sha256sum artifact/zImage
            echo
            echo "Module.symvers:"
            wc -l artifact/Module.symvers
            sha256sum artifact/Module.symvers
            echo
            echo "vmlinux:"
            file artifact/vmlinux
            echo
            echo "Kernel release:"
            cat artifact/KERNELRELEASE.txt
          } | tee artifact/BUILD_PRODUCTS.txt

      - name: Verify tested stock ABI including external media providers
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/compare_modversions.py \
            artifact/Module.symvers \
            stock/modversions \
            stock/modversions/providers.tsv \
            artifact/ABI_REPORT.md

          cat artifact/ABI_REPORT.md
          cat artifact/ABI_REPORT.md >> "$GITHUB_STEP_SUMMARY"

          if ! grep -q 'VERDICT=MATCH' artifact/ABI_REPORT.md; then
            echo "::error::Tested stock ABI fingerprint is not a complete match."
            exit 1
          fi

          echo "::notice::All 270 tested stock module imports resolved with matching CRCs."

      - name: Package checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d artifact ]]; then
            (
              cd artifact
              find . -type f ! -name SHA256SUMS.txt -print0 \
                | sort -z \
                | xargs -0 sha256sum
            ) > artifact/SHA256SUMS.txt
          fi

      - name: Upload final unmodified reproduction artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SlimBOX-S912-final-unmodified-reproduction
          path: artifact/
          if-no-files-found: warn
          retention-days: 14
